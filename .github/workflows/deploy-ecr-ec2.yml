name: CI/CD – Admin Docker → ECR → EC2

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-admin-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: "20"
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: getmaterials-admin
  CONTAINER_NAME: getmaterials-admin
  CONTAINER_PORT: 3000
  HOST_PORT: 3001
  DOCKER_NETWORK: getmaterials-net
  EC2_ENV_DIR: getmaterials-admin
  NEXT_TELEMETRY_DISABLED: "1"
  CI: "true"

jobs:

# ===========================================================
# 1. CI — INSTALL, BUILD, TYPECHECK
# ===========================================================
  ci:
    name: CI – Install, Build & Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify Node
        run: node -v && npm -v

      # next build generates next-env.d.ts (gitignored), which tsc needs.
      - name: Build
        run: npm run build

      - name: Typecheck
        run: npx tsc -p tsconfig.json --noEmit

      - name: Security Audit
        run: npm audit --audit-level=high || true

# ===========================================================
# 2. BUILD & PUSH → ECR
# ===========================================================
  build-and-push:
    name: Build Docker → Push ECR
    runs-on: ubuntu-latest
    needs: ci
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    timeout-minutes: 30

    outputs:
      full_image: ${{ steps.meta.outputs.full_image }}

    steps:
      - uses: actions/checkout@v4

      # NEXT_PUBLIC_* values are inlined at build time, so the build needs the env.
      - name: Write Build Env
        env:
          APP_ENV_FILE: ${{ secrets.ENV_FILE }}
        run: |
          if [ -z "$APP_ENV_FILE" ]; then
            echo "::error::Repository secret ENV_FILE is not set"
            exit 1
          fi
          printf '%s\n' "$APP_ENV_FILE" > "$RUNNER_TEMP/app.env"

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Ensure ECR Repository
        run: |
          aws ecr describe-repositories --repository-names "${{ env.ECR_REPOSITORY }}" >/dev/null 2>&1 \
            || aws ecr create-repository --repository-name "${{ env.ECR_REPOSITORY }}" \
                 --image-scanning-configuration scanOnPush=true >/dev/null

      - name: Generate Image
        id: meta
        run: |
          IMAGE="${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}"
          echo "full_image=$IMAGE:${{ github.sha }}" >> "$GITHUB_OUTPUT"
          echo "latest_image=$IMAGE:latest" >> "$GITHUB_OUTPUT"

      - name: Build & Push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          no-cache: true
          secret-files: |
            app_env=${{ runner.temp }}/app.env
          tags: |
            ${{ steps.meta.outputs.full_image }}
            ${{ steps.meta.outputs.latest_image }}

      - name: Remove Build Env
        if: always()
        run: rm -f "$RUNNER_TEMP/app.env"

# ===========================================================
# 3. DEPLOY → EC2  (same instance as the API, single container)
# ===========================================================
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    timeout-minutes: 15

    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
          retry-max-attempts: 5

      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        env:
          APP_ENV_FILE: ${{ secrets.ENV_FILE }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          envs: APP_ENV_FILE
          script: |
            set -e

            echo "🚀 DEPLOY START"

            APP_DIR="$HOME/${{ env.EC2_ENV_DIR }}"

            # 1. Prepare env directory
            mkdir -p "$APP_DIR"

            # 2. Write .env (Docker --env-file keeps wrapping quotes, so strip them)
            printf '%s\n' "$APP_ENV_FILE" > "$APP_DIR/.env"
            python3 - "$APP_DIR/.env" <<'PY'
            from pathlib import Path
            import sys
            path = Path(sys.argv[1])
            lines = []
            for raw in path.read_text().splitlines():
                if not raw.strip() or raw.lstrip().startswith("#") or "=" not in raw:
                    lines.append(raw)
                    continue
                key, _, value = raw.partition("=")
                value = value.strip()
                if len(value) >= 2 and value[0] == value[-1] and value[0] in "\"'":
                    value = value[1:-1]
                lines.append(f"{key.strip()}={value}")
            path.write_text("\n".join(lines) + "\n")
            PY
            chmod 600 "$APP_DIR/.env"

            # 3. Login to ECR
            aws ecr get-login-password --region ${{ env.AWS_REGION }} | \
              docker login --username AWS --password-stdin \
              ${{ steps.login-ecr.outputs.registry }}

            # 4. Pull new image
            IMAGE="${{ needs.build-and-push.outputs.full_image }}"
            docker pull "$IMAGE"

            # 5. Shared network with the API (reach it as http://getmaterials-server:4000)
            docker network create ${{ env.DOCKER_NETWORK }} 2>/dev/null || true

            # 6. Stop & remove old container
            docker stop ${{ env.CONTAINER_NAME }} 2>/dev/null || true
            docker rm ${{ env.CONTAINER_NAME }} 2>/dev/null || true

            # 7. Run container
            docker run -d \
              --name "${{ env.CONTAINER_NAME }}" \
              --network ${{ env.DOCKER_NETWORK }} \
              --restart unless-stopped \
              --env-file "$APP_DIR/.env" \
              -p ${{ env.HOST_PORT }}:${{ env.CONTAINER_PORT }} \
              -e NODE_ENV=production \
              -e PORT=${{ env.CONTAINER_PORT }} \
              -e HOSTNAME=0.0.0.0 \
              --log-opt max-size=10m \
              --log-opt max-file=3 \
              "$IMAGE"

            # 8. Wait for the Docker healthcheck
            STATUS=starting
            for _ in $(seq 1 30); do
              STATUS=$(docker inspect --format '{{.State.Health.Status}}' ${{ env.CONTAINER_NAME }} 2>/dev/null || echo missing)
              case "$STATUS" in healthy|unhealthy|missing) break ;; esac
              sleep 3
            done
            if [ "$STATUS" = healthy ]; then
              echo "✅ Container healthy"
              docker logs --tail 20 ${{ env.CONTAINER_NAME }}
            else
              echo "❌ Container not healthy (status: $STATUS)"
              docker logs --tail 200 ${{ env.CONTAINER_NAME }} || true
              exit 1
            fi

            # 9. Cleanup old images
            docker image prune -af --filter "until=72h"

            echo "✅ DEPLOY COMPLETE"
