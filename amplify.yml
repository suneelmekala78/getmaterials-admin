version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
    build:
      commands:
        - (env | grep -E '^(NEXTAUTH_SECRET|NEXTAUTH_URL|AUTH_SECRET|AUTH_URL|JWT_SECRET|API_INTERNAL_URL|NEXT_PUBLIC_)' || true) >> .env.production
        - grep -q '^AUTH_SECRET=' .env.production || (grep '^NEXTAUTH_SECRET=' .env.production | sed 's/^NEXTAUTH_SECRET=/AUTH_SECRET=/' >> .env.production) || true
        - grep -q '^AUTH_URL=' .env.production || (grep '^NEXTAUTH_URL=' .env.production | sed 's/^NEXTAUTH_URL=/AUTH_URL=/' >> .env.production) || true
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
